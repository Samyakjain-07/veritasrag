[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling can't auto-detect a wheel layout here (no top-level
# `veritasrag/` directory) -- explicitly ship `src/` and `dashboard/` as
# top-level installed packages so `import src...` / `import dashboard...`
# keep working identically to the `pythonpath = ["."]` pytest convention
# every phase has relied on so far (see PROGRESS.md's Phase 7/9 notes).
packages = ["src", "dashboard"]

[project]
name = "veritasrag"
version = "0.1.0"
description = "Trustworthy RAG integrity layer: poisoning detection, cryptographic provenance, and verifiable unlearning."
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph",
    "langchain",
    # Vector database
    "qdrant-client",
    # Embeddings
    "sentence-transformers",
    # Generation (provider-agnostic via src/generation/llm_client.py)
    "anthropic",
    "langchain-openai",
    "langchain-anthropic",
    # Backend API
    "fastapi",
    "uvicorn[standard]",
    # Poison detection
    "transformers",
    "scikit-learn",
    "faiss-cpu",
    "joblib",
    # LLM-as-judge baseline
    "openai",
    # Provenance & crypto
    "cryptography",
    # Evaluation
    "ragas",
    "datasets",
    # Observability
    "opentelemetry-api",
    "opentelemetry-sdk",
    # Dashboard
    "streamlit",
    "pandas",
    # Config
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
