name: CI

# PLAN.md Section 4.4's literal example step is `python eval/run_eval.py
# --smoke` -- no such flag exists on eval/run_eval.py's real CLI (see
# `--stage`/`--skip-judge` etc. in `eval/run_eval.py::main`), so the "eval
# smoke-test" step below approximates the same intent with the real flags
# instead of inventing a new `--smoke` mode on an already-large CLI outside
# this phase's scope. Flagged per CLAUDE.md's "say so explicitly" rule for
# deviations from PLAN.md.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Real Qdrant, not mocked -- matches every phase's own testing
    # philosophy ("no mocked ML", real integration tests that skip
    # gracefully only when genuinely unreachable; see
    # tests/vectorstore/test_qdrant_client.py and friends). Each
    # integration test seeds its own scratch collection, so an empty,
    # freshly-started Qdrant is sufficient -- no corpus upsert needed here.
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
    env:
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face model/dataset downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # torch is CPU-inference-only in this repo (distilgpt2 /
          # bge-small-en / nli-deberta-v3-xsmall) -- installing the CPU-only
          # wheel first avoids pulling ~2GB of unused CUDA/cuDNN/triton
          # libraries via the transitive sentence-transformers/transformers
          # install below (same trick as the root Dockerfile).
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(chr(10).join(deps))" > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          pip install pytest ruff

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready in time" >&2
          exit 1

      - name: Run tests
        run: pytest tests/ -v

      - name: Eval smoke-test (detection stage)
        run: python eval/run_eval.py --stage detection --skip-judge

      - name: Upload eval smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-eval-smoke-results
          path: eval/benchmarks/detection_eval_results.json
